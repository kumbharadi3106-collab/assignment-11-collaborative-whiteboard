<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Collaborative Whiteboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navigation / Toolbar -->
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="logo">
        <span class="logo-icon">🎨</span>
        <h1>CollabBoard</h1>
      </div>
      <div class="room-info">
        <span class="badge">Room: <strong id="currentRoomText">demo</strong></span>
        <button id="copyLinkBtn" class="btn btn-sm" title="Copy Invite Link">📋 Share</button>
      </div>
    </div>

    <!-- Center Drawing Controls -->
    <div class="toolbar-center">
      <!-- Tool Selection -->
      <div class="control-group">
        <button id="toolBrush" class="btn tool-btn active" title="Brush / Pen">
          ✏️ <span>Pen</span>
        </button>
        <button id="toolEraser" class="btn tool-btn" title="Eraser">
          🧹 <span>Eraser</span>
        </button>
      </div>

      <!-- Colors -->
      <div class="control-group color-group">
        <div class="color-palette">
          <button class="color-swatch active" data-color="#000000" style="background: #000000;" title="Black"></button>
          <button class="color-swatch" data-color="#ef4444" style="background: #ef4444;" title="Red"></button>
          <button class="color-swatch" data-color="#3b82f6" style="background: #3b82f6;" title="Blue"></button>
          <button class="color-swatch" data-color="#10b981" style="background: #10b981;" title="Green"></button>
          <button class="color-swatch" data-color="#f59e0b" style="background: #f59e0b;" title="Yellow"></button>
          <button class="color-swatch" data-color="#8b5cf6" style="background: #8b5cf6;" title="Purple"></button>
        </div>
        <div class="custom-color-wrapper">
          <input type="color" id="customColorPicker" value="#000000" title="Choose Custom Color" />
        </div>
      </div>

      <!-- Stroke Width -->
      <div class="control-group size-group">
        <label for="brushSize">Size:</label>
        <input type="range" id="brushSize" min="1" max="40" value="4" />
        <div id="sizePreview" class="size-preview"></div>
      </div>

      <!-- Action Buttons -->
      <div class="control-group">
        <button id="undoBtn" class="btn btn-action" title="Undo Stroke">
          ↩️ <span>Undo</span>
        </button>
        <button id="clearBtn" class="btn btn-danger" title="Clear Canvas">
          🗑️ <span>Clear</span>
        </button>
        <button id="downloadBtn" class="btn btn-secondary" title="Export as PNG">
          💾 <span>Save</span>
        </button>
      </div>
    </div>

    <!-- Active Collaborators -->
    <div class="toolbar-right">
      <div class="users-container">
        <span class="users-label">Collaborators (<span id="userCount">1</span>):</span>
        <div id="usersList" class="users-list"></div>
      </div>
    </div>
  </header>

  <!-- Main Canvas Workspace -->
  <main class="canvas-container" id="canvasWrapper">
    <canvas id="paintCanvas"></canvas>
    <!-- Live collaborator cursor overlays will be injected here -->
    <div id="cursorOverlay" class="cursor-overlay"></div>
  </main>

  <!-- Join Room Modal (if user wants to change room or name) -->
  <div id="joinModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Join Collaborative Whiteboard</h2>
      <p>Enter your details to start sketching in real time.</p>
      
      <div class="form-group">
        <label for="modalUsername">Your Name</label>
        <input type="text" id="modalUsername" placeholder="e.g. Alice" maxlength="20" />
      </div>

      <div class="form-group">
        <label for="modalBoardId">Board Room ID</label>
        <input type="text" id="modalBoardId" placeholder="e.g. DESIGN_101" />
      </div>

      <div class="form-group">
        <label>Your Cursor Color</label>
        <div class="color-palette user-color-picker">
          <button type="button" class="user-swatch active" data-color="#ff5722" style="background: #ff5722;"></button>
          <button type="button" class="user-swatch" data-color="#3b82f6" style="background: #3b82f6;"></button>
          <button type="button" class="user-swatch" data-color="#10b981" style="background: #10b981;"></button>
          <button type="button" class="user-swatch" data-color="#8b5cf6" style="background: #8b5cf6;"></button>
          <button type="button" class="user-swatch" data-color="#ec4899" style="background: #ec4899;"></button>
        </div>
      </div>

      <button id="joinBtn" class="btn btn-primary btn-block">Join Whiteboard</button>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Socket.io Client Script & App Logic -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
